id = "worktree-stack"
name = "Worktree Stack"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Auto-setup + teardown of worktree docker stacks: on worktree.created mounts the isolated compose stack (compose.worktree.yml + APP_HOST prefix), on worktree.removed kills it (label-based, works after checkout removal)."
platforms = ["linux"]

[[events]]
on = "worktree.created"
command = ["bash", "setup.sh"]

[[events]]
on = "worktree.removed"
command = ["bash", "teardown.sh"]

[[actions]]
id = "up"
title = "Worktree Stack: up (mount/ensure worktree stack)"
contexts = ["workspace"]
command = ["bash", "setup.sh"]

[[actions]]
id = "down"
title = "Worktree Stack: down (kill worktree containers)"
contexts = ["workspace"]
command = ["bash", "teardown.sh"]

[[actions]]
id = "info"
title = "Worktree Stack: info (show worktree project containers)"
contexts = ["workspace"]
command = ["bash", "info.sh"]
