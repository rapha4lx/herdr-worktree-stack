id = "worktree-stack"
name = "Worktree Stack"
version = "0.5.0"
min_herdr_version = "0.7.0"
description = "Auto-setup + teardown of worktree docker stacks: on worktree.created mounts the isolated compose stack (compose.worktree.yml + APP_HOST via wt_host), on worktree.removed kills it (label-based, works after checkout removal)."
platforms = ["linux"]

[[events]]
on = "worktree.created"
command = ["bash", "setup.sh"]

[[events]]
on = "worktree.removed"
command = ["bash", "teardown.sh"]

[[actions]]
id = "up"
title = "Worktree Stack: up (mount/ensure worktree stack)"
contexts = ["workspace"]
command = ["bash", "setup.sh"]

[[actions]]
id = "down"
title = "Worktree Stack: down (kill worktree containers)"
contexts = ["workspace"]
command = ["bash", "teardown.sh"]

[[actions]]
id = "info"
title = "Worktree Stack: info (show worktree project containers)"
contexts = ["workspace"]
command = ["bash", "info.sh"]

[[actions]]
id = "seed"
title = "Worktree Stack: seed (force refresh dev data from origin)"
contexts = ["workspace"]
command = ["bash", "-c", "bash setup.sh && dir=\"$(pwd)\"; [ -n \"${HERDR_PLUGIN_CONTEXT_JSON:-}\" ] && parsed=\"$(python3 -c 'import json,os,sys; d=json.loads(os.environ.get(\"HERDR_PLUGIN_CONTEXT_JSON\", \"{}\")); print(d.get(\"worktree\",{}).get(\"checkout_path\") or d.get(\"workspace_cwd\") or \"\")' 2>/dev/null)\" && [ -n \"$parsed\" ] && dir=\"$parsed\"; wt_list=\"$(git -C \"$dir\" worktree list --porcelain 2>/dev/null || true)\"; main_path=\"$(printf '%s\\n' \"$wt_list\" | awk '/^worktree /{p=substr($0,10); if(!m) m=p} END{print m}')\"; [ -z \"$main_path\" ] && main_path=\"$dir\"; repo=\"$(basename \"$main_path\" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')\"; b=\"$(basename \"$dir\")\"; tag=\"$(printf '%s\\n' \"$b\" | awk -F'-' '{t=$NF} END{if(t~/^[0-9a-f]{4,10}$/) print t; else {m=substr($0,1,3); gsub(/[^a-zA-Z0-9]/,\"\",m); print tolower(m)}}')\"; [ -z \"$tag\" ] && tag=\"dev\"; project=\"${repo}-${tag}\"; bash seed.sh --cwd \"$dir\" --project \"$project\" --main \"$main_path\" --force"]
